<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
          --bg: #f7f6f2;
          --card: #ffffff;
          --text: #28251d;
          --muted: #6b6b6b;
          --border: #d8d6d0;
          --primary: #01696f;
          --primary-hover: #0c4e54;
          --error-bg: #fbe9ef;
          --error-text: #8a1f5c;
          --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
          --radius: 16px;
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          font-family: Arial, sans-serif;
          background: linear-gradient(180deg, #f7f6f2 0%, #ece8e1 100%);
          color: var(--text);
        }

        .login-card {
          width: 100%;
          max-width: 420px;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          padding: 32px;
        }

        h1 {
          margin: 0 0 8px;
          font-size: 2rem;
          text-align: center;
        }

        .subtitle {
          margin: 0 0 24px;
          text-align: center;
          color: var(--muted);
          font-size: 0.95rem;
        }

        .alert {
          margin-bottom: 16px;
          padding: 12px 14px;
          border-radius: 12px;
          background: var(--error-bg);
          color: var(--error-text);
          font-size: 0.95rem;
          border: 1px solid #f2c8d8;
        }

        form {
          display: grid;
          gap: 16px;
        }

        .form-group {
          display: grid;
          gap: 8px;
        }

        label {
          font-size: 0.95rem;
          font-weight: 600;
        }

        input {
          width: 100%;
          padding: 14px 16px;
          border: 1px solid var(--border);
          border-radius: 12px;
          font-size: 1rem;
          background: #fff;
          transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
          outline: none;
          border-color: var(--primary);
          box-shadow: 0 0 0 4px rgba(1, 105, 111, 0.15);
        }

        button {
          margin-top: 8px;
          width: 100%;
          padding: 14px 16px;
          border: none;
          border-radius: 12px;
          background: var(--primary);
          color: white;
          font-size: 1rem;
          font-weight: 700;
          cursor: pointer;
          transition: background 0.2s ease, transform 0.05s ease;
        }

        button:hover {
          background: var(--primary-hover);
        }

        button:active {
          transform: translateY(1px);
        }

        @media (max-width: 480px) {
          .login-card {
            padding: 24px;
          }

          h1 {
            font-size: 1.75rem;
          }
        }
    </style>
</head>
<body>

<main class="login-card">
    <h1>Login</h1>
    <p class="subtitle">Sign in to access your account</p>

    <div th:if="${param.error}" class="alert">
        Invalid username or password.
    </div>

    <form action="/login" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" required autofocus />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required />
        </div>

        <button type="submit">Login</button>
    </form>

    <p style="text-align:center; margin-top: 16px; font-size: 0.9rem;">
        <a th:href="@{/forgot-password}" style="color: var(--primary);">Forgot your password?</a>
    </p>
</main>

</body>
</html>
