<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Coop Jeanne-Mance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          background: #faf8f2;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          font-family: Georgia, 'Times New Roman', serif;
        }

        .container { text-align: center; padding: 2rem 1rem; }

        /* ── Floating buildings ── */
        svg.buildings {
          width: 540px;
          max-width: 92vw;
          animation: float 4s ease-in-out infinite;
          filter: drop-shadow(0 10px 18px rgba(0,0,0,0.13));
        }
        @keyframes float {
          0%,100% { transform: translateY(0px); }
          50%      { transform: translateY(-10px); }
        }

        /* ── SVG sketch style ── */
        .sk  { fill: none; stroke: #1a1a1a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .sk2 { fill: none; stroke: #1a1a1a; stroke-width: 1.0; stroke-linecap: round; stroke-linejoin: round; opacity:0.45; }
        .win-off { fill: #e6e0d0; stroke: #1a1a1a; stroke-width: 1; }
        .win-on  { fill: #fde68a; stroke: #1a1a1a; stroke-width: 1; animation: glow 3s ease-in-out infinite; }
        .win-on.d1 { animation-delay: 0s; }
        .win-on.d2 { animation-delay: 1.1s; }
        .win-on.d3 { animation-delay: 2.2s; }
        @keyframes glow {
          0%,100% { fill: #fde68a; }
          50%      { fill: #fef9c3; }
        }

        /* ── Title ── */
        h1 {
          margin-top: 1.8rem;
          font-size: clamp(1.4rem, 4vw, 2.2rem);
          font-weight: normal;
          letter-spacing: 0.18em;
          color: #1c1c1c;
          text-transform: uppercase;
        }
        .dots span { animation: blink 1.6s infinite; }
        .dots span:nth-child(2) { animation-delay: 0.28s; }
        .dots span:nth-child(3) { animation-delay: 0.56s; }
        @keyframes blink { 0%,60%,100%{opacity:0;} 30%{opacity:1;} }

        .subtitle {
          margin-top: 0.55rem;
          font-size: 1rem;
          color: #777;
          font-style: italic;
          letter-spacing: 0.04em;
        }

        /* ── Construction tape ── */
        .tape {
          margin: 1.8rem auto 0;
          width: min(440px, 88vw);
          height: 15px;
          background: repeating-linear-gradient(
            -45deg,
            #f59e0b 0 13px,
            #1a1a1a 13px 26px
          );
          border-radius: 3px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        }

        /* ── Progress row ── */
        .row {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 1.1rem;
          margin-top: 1.5rem;
        }
        .icon { font-size: 2rem; animation: tilt 2s ease-in-out infinite; }
        .icon.r { animation-direction: alternate-reverse; }
        @keyframes tilt { 0%,100%{transform:rotate(-9deg);} 50%{transform:rotate(9deg);} }

        .bar-wrap {
          width: 190px; height: 9px;
          background: #e2dcd0;
          border-radius: 5px;
          overflow: hidden;
        }
        .bar-fill {
          height: 100%;
          background: linear-gradient(90deg, #f59e0b, #fbbf24);
          border-radius: 5px;
          animation: progress 7s ease-in-out infinite alternate;
        }
        @keyframes progress { 0%{width:8%;} 100%{width:82%;} }
    </style>
</head>
<body>
<div class="container">

    <!-- ══════════════ SVG BUILDINGS ══════════════ -->

        <rect x="307" y="62" width="22" height="24" class="win-off"/>
        <path d="M304,62 Q318,48 332,62" class="sk"/>
        <!-- roof detail line -->
        <line x1="156" y1="56" x2="358" y2="56" class="sk"/>
        <!-- battlements -->
        <rect x="174" y="48" width="12" height="10" class="sk"/>
        <rect x="253" y="44" width="12" height="13" class="sk"/>

        <!-- F1 windows -->
        <rect x="358" y="192" width="30" height="32" class="win-on d3"/>
        <rect x="418" y="192" width="30" height="32" class="win-off"/>

        <!-- ─── Ground line ─── -->
        <line x1="8" y1="281" x2="522" y2="281" class="sk"/>
        <line x1="18" y1="285" x2="512" y2="285" class="sk2"/>
    </svg>

    <!-- ── Text & decoration ── -->
    <h1>En Construction<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
    <p class="subtitle">Le site web de la Coopérative Jeanne-Mance</p>
    <p class="subtitle">Revenez nous voir sous peu</p>

    <div class="tape"></div>

    <div class="row">
        <span class="icon">🪖</span>
        <div class="bar-wrap"><div class="bar-fill"></div></div>
        <span class="icon r">🔨</span>
    </div>

</div>
</body>
</html>
