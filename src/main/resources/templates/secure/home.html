<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Coopérative d'habitation</title>
        <link rel="stylesheet" th:href="@{/css/app.min.css}" />
        <script th:src="@{/js/navigation.js}" defer></script>
        <script th:src="@{/js/announcement-expander.js}" defer></script>
        <script th:src="@{/js/announcement-composer.js}" defer></script>
    </head>
    <body>
        <header th:replace="~{fragments/shared :: siteHeader}"></header>

        <main class="relative flex">
            <div th:replace="~{fragments/shared :: mainNavigation}"></div>

            <section class="mt-8 flex-auto">
                <div class="home-announcements-heading">
                    <h2 class="flex-1 text-center font-serif text-3xl font-semibold italic">Annonces</h2>
                    <button id="open-announcement-dialog" type="button" th:if="${canPublishPost}">Écrire</button>
                </div>
                <p th:if="${announcementSuccess}" class="mx-3 text-center" role="status" th:text="${announcementSuccess}"></p>
                <div class="flex flex-col items-center px-3">
                    <article th:each="announcement : ${announcements}" class="m-2 w-full space-y-4 rounded-3xl border-2 p-4">
                        <h3 class="font-display mb-1 text-2xl" th:text="${announcement.title}">Titre de l'annonce</h3>
                        <p class="text-sm text-gray-600">
                            <span th:text="${announcement.authorName}">Auteur</span>
                            <span aria-hidden="true"> · </span>
                            <time th:datetime="${announcement.publishedAt}" th:text="${#temporals.format(announcement.publishedAt, 'd MMMM yyyy', new java.util.Locale('fr'))}">25 novembre 2026</time>
                        </p>
                        <div class="announcement-body announcement-markdown" th:utext="${announcement.bodyHtml}"></div>
                        <button type="button" class="announcement-toggle rounded-full px-3 py-1 text-xl" aria-expanded="false" aria-label="Afficher la suite de l'annonce" hidden>...</button>
                    </article>
                    <p th:if="${#lists.isEmpty(announcements)}" class="m-2 w-full text-center">Aucune annonce pour le moment.</p>
                </div>
            </section>
        </main>

        <dialog id="announcement-dialog" class="announcement-dialog" th:if="${canPublishPost}" th:attr="data-open=${openAnnouncementDialog}" aria-label="Écrire une annonce">
            <p th:if="${announcementError}" class="announcement-form-error" role="alert" th:text="${announcementError}"></p>

            <form id="announcement-form" method="post" th:action="@{/home/announcements}">
                <div class="announcement-form-field">
                    <label for="announcement-title">Titre</label>
                    <input id="announcement-title" name="title" type="text" maxlength="40" required
                           th:value="${draftTitle}" aria-describedby="announcement-title-help" />
                    <p id="announcement-title-help" class="announcement-field-help">40 caractères maximum.</p>
                </div>

                <div class="announcement-form-field announcement-body-field">
                    <div class="announcement-body-label">
                        <label for="announcement-body-markdown">Texte</label>
                        <output id="announcement-body-count" aria-live="polite" hidden></output>
                    </div>
                    <div id="announcement-markdown-editor">
                        <div class="announcement-markdown-toolbar" role="toolbar" aria-label="Mise en forme Markdown">
                            <button type="button" data-markdown-action="bold" title="Gras">Gras</button>
                            <button type="button" data-markdown-action="italic" title="Italique">Italique</button>
                            <button type="button" data-markdown-action="bullets" title="Liste à puces">• Liste</button>
                            <button type="button" data-markdown-action="numbered" title="Liste numérotée">1. Liste</button>
                        </div>
                        <textarea id="announcement-body-markdown" name="bodyMarkdown" rows="5" maxlength="4000" required
                                  aria-describedby="announcement-body-help"
                                  th:text="${draftBody}"></textarea>
                    </div>
                    <p id="announcement-editor-error" class="announcement-form-error" role="alert" hidden></p>
                    <div id="announcement-markdown-preview" class="announcement-preview announcement-markdown" hidden></div>
                    <p id="announcement-body-help" class="announcement-field-help">Markdown · 4 000 caractères maximum.</p>
                    <p id="announcement-preview-error" class="announcement-form-error" role="alert" hidden></p>
                </div>

                <div class="announcement-form-footer">
                    <button id="announcement-publish-button" type="submit" class="rounded-lg border px-3 py-2">Publier</button>
                    <button id="announcement-preview-toggle" type="button" aria-pressed="false">Aperçu</button>
                    <button id="close-announcement-dialog" type="button" class="rounded-lg border p-2" aria-label="Annuler l'écriture" title="Annuler l'écriture" autofocus>
                        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <path d="M6 6l12 12M18 6L6 18" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </form>
        </dialog>
    </body>
</html>
