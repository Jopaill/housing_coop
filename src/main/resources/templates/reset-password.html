<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Réinitialiser le mot de passe</title>
        <link rel="stylesheet" th:href="@{/css/common.css}">
    </head>

    <body>
        <main class="login-card">
            <h1>Réinitialiser votre mot de passe</h1>

            <div th:if="${param.error}" class="alert">
                Ce lien est invalide / expiré
            </div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-group">
                    <label for="newPassword">Nouveau mot de passe</label>
                    <input id="newPassword" type="password" name="newPassword" required autofocus />
                </div>

                <button type="submit">Réinitialiser</button>
            </form>

            <p style="text-align:center; margin-top: 16px; font-size: 0.9rem;">
                <a th:href="@{/login}" style="color: var(--primary);">Retour à connexion</a>
            </p>
        </main>
    </body>

</html>
