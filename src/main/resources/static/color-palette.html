<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Co-op color palette</title>
        <link rel="stylesheet" href="css/common.css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            body {
                background: var(--coop-pink-50);
                color: var(--coop-brown-900);
                font-family: system-ui, sans-serif;
            }

            main {
                display: flex;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                flex-direction: column;
                gap: clamp(0.25rem, 0.75vh, 0.5rem);
                overflow: hidden;
                padding: clamp(0.25rem, 0.75vh, 0.75rem);
            }

            .palette {
                display: grid;
                min-height: 0;
                flex: 1;
            }

            .swatches {
                display: grid;
                min-width: 0;
                min-height: 0;
                grid-template-columns: repeat(11, minmax(0, 1fr));
                gap: clamp(1px, 0.3vw, 0.3rem);
                overflow: hidden;
            }

            .swatch {
                display: flex;
                min-width: 0;
                min-height: 0;
                flex-direction: column;
                overflow: hidden;
                border: 1px solid var(--coop-brown-200);
                border-radius: clamp(0.15rem, 0.5vw, 0.5rem);
                background: white;
                box-shadow: 0 1px 3px rgb(0 0 0 / 8%);
            }

            .swatch-color {
                min-height: 0;
                flex: 1;
            }

            .swatch-label {
                flex: none;
                padding: clamp(1px, 0.25vh, 0.2rem) 1px;
            }

            .swatch-label code {
                color: var(--coop-brown-700);
                display: block;
                font-size: clamp(0.35rem, 0.9vh, 0.65rem);
                line-height: 1;
                overflow-wrap: anywhere;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <main>
            <section class="palette" data-palette="orange">
                <div class="swatches"></div>
            </section>
            <section class="palette" data-palette="pink">
                <div class="swatches"></div>
            </section>
            <section class="palette" data-palette="green">
                <div class="swatches"></div>
            </section>
            <section class="palette" data-palette="brown">
                <div class="swatches"></div>
            </section>
        </main>

        <script>
            const shades = ["50", "100", "200", "300", "400", "500", "600", "700", "800", "900", "950"];

            document.querySelectorAll(".palette").forEach((palette) => {
                const colorName = palette.dataset.palette;
                const swatches = palette.querySelector(".swatches");

                shades.forEach((shade) => {
                    const variableName = `--coop-${colorName}-${shade}`;
                    const swatch = document.createElement("article");
                    swatch.className = "swatch";
                    swatch.title = variableName;

                    const color = document.createElement("div");
                    color.className = "swatch-color";
                    color.style.backgroundColor = `var(${variableName})`;
                    color.setAttribute("aria-hidden", "true");

                    const label = document.createElement("div");
                    label.className = "swatch-label";
                    const variableLabel = document.createElement("code");
                    variableLabel.textContent = variableName;
                    label.append(variableLabel);

                    swatch.append(color, label);
                    swatches.append(swatch);
                });
            });
        </script>
    </body>
</html>
