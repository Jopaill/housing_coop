<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Connexion</title>
        <link rel="stylesheet" th:href="@{/css/common.css}" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body>
        <div class="w-full max-w-100 p-4 m-4 border">
            <div class="flex justify-end pb-6">
                <a class="text-xs underline" th:href="@{/create-account}">Créer un compte!</a>
            </div>
            <h1 class="text-center mb-12 text-1xl italic">Coopérative d'habitation Jeanne-Mance</h1>

            <div id="login-error" class="text-xs" th:if="${param.error}">⚠️ Courriel ou mot de passe invalide</div>

            <form action="/login" method="post">
                <div class="mb-2 p-1 flex items-center border-b">
                    <label for="username"></label>
                    <!-- prettier-ignore -->
                    <svg class="ml-1 mr-2 w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="8" r="5" /> <path d="M20 21a8 8 0 0 0-16 0" /> </svg>
                    <input class="px-2 w-full" id="username" type="email" name="username" required autofocus autocomplete="username" placeholder="    courriel" />
                </div>
                <div class="p-1 flex items-center border-b">
                    <label for="password"></label>
                    <!-- prettier-ignore -->
                    <svg class="ml-1 mr-2 w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /> <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /> </svg>
                    <input class="px-2 w-full" id="password" type="password" name="password" required autocomplete="current-password" placeholder="    mot de passe" />
                </div>
                <div class="flex justify-end">
                    <a class="text-xs underline" th:href="@{/forgot-password}">Mot de passe oublié?</a>
                </div>
                <div class="flex justify-center">
                    <button class="mr-6 px-2 border rounded-xl" type="submit">Connexion</button>
                </div>
            </form>
        </div>
    </body>
    <script th:if="${param.error}">
        const emailInput = document.getElementById("username");
        const errorMessage = document.getElementById("login-error");

        emailInput.addEventListener("input", () => {
            errorMessage?.remove();
        });
    </script>
</html>
