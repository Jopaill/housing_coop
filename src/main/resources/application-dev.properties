# Remark 1: You also need to set the following env vars:
#    > -DMAILERSEND_API_TOKEN=mlsn.099a2****

# Remark 2: You have to set up the active profile to "dev"


spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-dev.sql
#  spring.sql.init.data-locations=classpath:data-dev.sql

spring.h2.console.enabled=true

base.url=http://localhost:8080

# Postmark details
    # POSTMARK_API_TOKEN=set up in the env vars
POSTMARK_FROM_EMAIL=coopjm-no-reply-dev@coopjm.ca
POSTMARK_SUBJECT=[dev] Reset your password
POSTMARK_MESSAGE_STREAM=reset-password-prod

## To make edits to the HTML and be reflected immediately
spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.max-age=0
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true