<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Coopérative d'habitation</title>
        <link rel="stylesheet" href="../../static/css/common.css" th:href="@{/css/common.css}" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script th:src="@{/js/navigation.js}" defer></script>
    </head>
    <body>
        <header th:replace="~{fragments/shared :: siteHeader}"></header>

        <main class="relative flex">
            <div th:replace="~{fragments/shared :: mainNavigation}"></div>

            <section class="mt-8 flex-auto">
                <h2 class="text-center font-serif text-3xl font-semibold italic">Annonces</h2>
                <div class="flex flex-col items-center px-3">
                    <article class="m-2 w-full space-y-4 rounded-3xl border-2 p-4">
                        <h2 class="font-display text-2xl underline underline-offset-4">🍂 La corvée d'automne</h2>
                        <p>
                            Le comité des Espaces verts et blancs (EVB) vous informe que la prochaine corvée d'automne aura lieu le
                            <strong>samedi 7 novembre 2026, dès 10 h</strong>.
                        </p>
                    </article>
                    <article class="m-2 w-full space-y-4 rounded-3xl border-2 p-4">
                        <h2 class="font-display text-2xl underline underline-offset-4">
                            <span aria-hidden="true">💻</span>
                            Création du site web
                        </h2>

                        <p>Vous avez suggestion, commentaire ou <i>bug</i> à signaler, écrivez à :</p>

                        <p>
                            <a href="mailto:admincoopjm@gmail.com?subject=Suggestion%20pour%20le%20site%20web" class="font-semibold underline underline-offset-4 hover:opacity-80"> admincoopjm@gmail.com </a>
                        </p>
                    </article>
                </div>
            </section>
        </main>

    </body>
</html>
