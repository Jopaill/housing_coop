<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nouveau mot de passe</title>
        <link rel="stylesheet" th:href="@{/css/common.css}" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body>
        <div class="mx-auto my-4 w-[calc(100%-2rem)] max-w-100 border p-4">
            <div class="flex justify-end pb-6">
                <a class="text-xs underline" th:href="@{/public/login}">Retour à connexion</a>
            </div>

            <h1 class="mb-12 text-center italic">Nouveau mot de passe</h1>

            <div th:if="${param.error}">L'opération a échoué. Veuillez recommencer par renvoyer un lien pour changer le mot de passe.</div>

            <form class="mb-5" th:action="@{/public/reset-password}" method="post" th:unless="${param.error}">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="flex items-center border-b p-1">
                    <label class="sr-only" for="newPassword">Nouveau mot de passe</label>
                    <!-- prettier-ignore -->
                    <svg aria-hidden="true" class="ml-1 mr-2 w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /> <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /> </svg>
                    <input class="min-w-0 flex-1 px-2" id="newPassword" type="password" name="newPassword" autocomplete="new-password" required autofocus placeholder="mot de passe" />
                </div>

                <div class="mb-5 flex justify-end">
                    <input type="checkbox" id="showPassword" />
                    <label for="showPassword">Afficher le mot de passe</label>
                </div>

                <div class="flex justify-center">
                    <button class="rounded-xl border px-2" type="submit">Changer</button>
                </div>
            </form>
        </div>
        <script>
            const passwordInput = document.getElementById("newPassword");
            const showPasswordCheckbox = document.getElementById("showPassword");

            if (passwordInput && showPasswordCheckbox) {
                showPasswordCheckbox.addEventListener("change", function () {
                    passwordInput.type = this.checked ? "text" : "password";
                });
            }
        </script>
    </body>
</html>
