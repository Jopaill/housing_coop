# fly.toml app configuration file generated for src-thrumming-river-5809 on 2026-03-28T11:57:34-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'housing-coop'
primary_region = 'yyz'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/login"

[[restart]]
policy = "never"

[[vm]]
  memory = '512'
  cpus = 1
  memory_mb = 512
