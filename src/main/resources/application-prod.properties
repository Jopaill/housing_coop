#   The OS env vars DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD were set manually
#   > fly ssh console
#   > echo $DATABASE_URL
#   # From the result, I set secrets in fly.io:
#   > fly secrets set
#         DB_HOST=housing-coop-db.flycast ^
#         DB_PORT=5432 ^
#         DB_NAME=housing_coop ^
#         DB_USER=housing_coop ^
#         DB_PASSWORD=thePasswordFoundInTheURL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-prod.sql

base.url=https://coopjm.ca


# Postmark details
    # POSTMARK_API_TOKEN=set up in the env vars
custom.email.from=no-reply@coopjm.ca
custom.email.subject=Nouveau mot de passe
postmark.message.stream=reset-password-prod