<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Section</title>
    <style>
        :root {
            --bg: #f7f6f2;
            --surface: #ffffff;
            --text: #28251d;
            --muted: #6f6a61;
            --primary: #01696f;
            --border: #d8d2c8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", "Segoe UI", sans-serif;
        }

        .panel {
            width: min(640px, 100%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.25rem;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0.75rem;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
        }

        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            font-size: 1.05rem;
        }

        a {
            display: inline-block;
            padding: 0.85rem 1.2rem;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
<section class="panel">
    <h1 th:text="${titre}">Section</h1>
    <p>Pas encore fonctionnel.</p>
    <a th:href="@{/}">Retour à l'accueil</a>
</section>
</body>
</html>
