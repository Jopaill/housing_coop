<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password</title>
        <link rel="stylesheet" th:href="@{/css/common.css}">
    </head>

    <body>
        <main class="login-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password below</p>

            <div th:if="${param.error}" class="alert">
                This reset link is invalid or has expired.
            </div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input id="newPassword" type="password" name="newPassword" required autofocus />
                </div>

                <button type="submit">Reset Password</button>
            </form>

            <p style="text-align:center; margin-top: 16px; font-size: 0.9rem;">
                <a th:href="@{/login}" style="color: var(--primary);">Back to login</a>
            </p>
        </main>
    </body>

</html>
